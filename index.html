<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>まわり将棋 v1.0.6</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header>
    <h1>まわり将棋</h1>
    <p class="sub">v1.0.6 — 音声内蔵版</p>
  </header>

  <section id="setup" class="card">
    <div class="setup-row">
      <label for="humanCount">遊ぶ人数</label>
      <select id="humanCount">
        <option value="1">1人</option><option value="2">2人</option>
        <option value="3">3人</option><option value="4">4人</option>
      </select>
      <button id="randomNames" class="secondary">名前をランダム</button>
    </div>
    <div id="nameGrid" class="name-grid"></div>
    <button id="startButton">ゲーム開始</button>
  </section>

  <section class="card game-card">
    <div class="board-row">
      <div class="board-column">
        <div id="board" aria-label="9×9の将棋盤">
          <div id="warShade" class="war-shade"></div>
          <div id="hand" class="hand" aria-hidden="true">
            <span class="hand-sleeve"></span>
            <span class="hand-palm"></span>
            <span class="hand-finger hand-index"></span>
            <span class="hand-finger hand-thumb"></span>
          </div>
          <div id="event" class="event"></div>
        </div>
      </div>
      <aside id="ladder" class="ladder">
        <h2>出世表</h2>
        <div id="rankRows"></div>
      </aside>
    </div>

    <div id="turnBox" class="turn-box">開始前</div>
    <div id="roller" class="roller" aria-label="金駒を振る場所">
      <div id="rollerHint" class="roller-hint">金をくるくる回して<br>指を離す</div>
    </div>
    <button id="rollButton" class="roll-button" disabled>▶ あなたが金を振る</button>
    <button id="audioButton" class="audio-button">音を確認・再開</button>
    <div id="result" class="result"></div>
  </section>

  <section class="card"><div id="players" class="players"></div></section>
  <section class="card"><div id="log" class="log"></div></section>
</main>
<script src="game.js"></script>
</body>
</html>
