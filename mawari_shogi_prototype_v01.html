<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>まわり将棋 試作 v0.1</title><style>
body{margin:0;background:#e9e4da;color:#1d1d1b;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif}.app{max-width:720px;margin:auto;padding:14px}.card{background:#f7f4ed;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 8px 24px #0001}h1{font-size:24px;margin:6px 0}.sub,.small{color:#6f6a61;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{font-size:15px;border-radius:12px;padding:11px 14px}button{border:0;background:#20201d;color:#fff;font-weight:700}button.secondary{background:#d8d2c6;color:#222}button:disabled{opacity:.35}#board{position:relative;width:min(92vw,560px);aspect-ratio:1;background:linear-gradient(115deg,#e3bf84,#cca167);border:4px solid #574329;margin:auto}.cell{position:absolute;border:1px solid #6e542f88}.piece{position:absolute;z-index:4;width:8.4%;height:10.2%;transform:translate(-50%,-50%);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);background:linear-gradient(145deg,#f0cf91,#c99652);border:1px solid #68451d;display:flex;align-items:center;justify-content:center;font-family:'Yu Mincho',serif;font-weight:800;font-size:clamp(12px,3vw,21px);transition:left .2s,top .2s,transform .35s;filter:drop-shadow(0 3px 2px #0003)}.cushion{position:absolute;z-index:3;width:9.6%;height:4.3%;transform:translate(-50%,35%);border-radius:50%;opacity:.8}.goldArea{display:flex;gap:8px;justify-content:center;min-height:66px;margin:10px 0}.gold{width:54px;height:62px;clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);background:linear-gradient(145deg,#f0cf91,#c99652);border:2px solid #68451d;display:flex;align-items:center;justify-content:center;font-family:serif;font-weight:800;transition:transform .45s}.gold.side{width:62px;height:14px;clip-path:none;border-radius:5px;margin-top:24px}.gold.vertical{width:13px;height:62px;clip-path:none;border-radius:5px}.seatGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.seat{background:#e5dfd4;color:#222;border:2px solid transparent}.seat.selected{border-color:#222}.playerList{display:grid;grid-template-columns:1fr 1fr;gap:8px}.playerBox{background:#ece7de;border-radius:12px;padding:10px;font-size:14px}.playerBox.active{outline:3px solid #222}.playerBox.done{opacity:.5}.log{height:160px;overflow:auto;background:#161613;color:#eee;border-radius:12px;padding:10px;font:12px/1.55 ui-monospace,monospace}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.show{display:flex}.modalPanel{width:min(94vw,560px);background:#f7f4ed;border-radius:20px;padding:18px}.warTrack{display:grid;grid-template-columns:repeat(17,1fr);gap:2px;margin:14px 0}.warCell{height:28px;background:#d8c8ad;border-radius:3px;position:relative}.warMark{position:absolute;inset:4px;border-radius:50%}
</style></head><body><div class='app'><h1>まわり将棋</h1><div class='sub'>戦争ルール試作 v0.1 — ルール確認用</div><div class='card'><div class='row'><label>人数</label><select id='count'><option value='1'>1人（CPUと対戦）</option><option value='2' selected>2人</option><option value='3'>3人</option><option value='4'>4人</option></select><button id='resetSeats' class='secondary'>席を選び直す</button></div><div class='small'>角を選択。2人・1人モードは対角が自動選択されます。</div><div class='seatGrid'><button class='seat' data-seat='0'>左上</button><button class='seat' data-seat='1'>右上</button><button class='seat' data-seat='3'>左下</button><button class='seat' data-seat='2'>右下</button></div><div style='margin-top:12px'><button id='start'>順番を決めて開始</button></div></div><div class='card'><div id='board'></div><div class='goldArea' id='goldArea'></div><div class='row' style='justify-content:center'><button id='roll' disabled>金を振る</button><button id='auto' class='secondary' disabled>CPUを進める</button></div><div id='result' style='text-align:center;margin-top:8px;font-weight:700'></div></div><div class='card'><div class='playerList' id='players'></div></div><div class='card'><div class='log' id='log'></div></div></div><div class='modal' id='warModal'><div class='modalPanel'><h2>戦争</h2><div id='warTitle'></div><div class='warTrack' id='warTrack'></div><div id='warGold' class='goldArea'></div><div id='warStatus' style='text-align:center;font-weight:700'></div><div class='row' style='justify-content:center;margin-top:12px'><button id='warRoll'>金を振る</button></div></div></div><script>
const colors=['#b6483d','#315f8c','#668447','#8a5b91'],ranks=['歩','と','香','成香','桂','成桂','銀','成銀','角','馬','飛','龍','王'],cornerRing=[0,8,16,24];let selectedSeats=[],players=[],turnIndex=0,running=false,busy=false,war=null;const board=document.getElementById('board'),logEl=document.getElementById('log'),resultEl=document.getElementById('result'),rollBtn=document.getElementById('roll'),autoBtn=document.getElementById('auto');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));function log(s){let d=document.createElement('div');d.textContent=s;logEl.appendChild(d);logEl.scrollTop=99999}function ringCoords(){let a=[];for(let c=0;c<9;c++)a.push([0,c]);for(let r=1;r<9;r++)a.push([r,8]);for(let c=7;c>=0;c--)a.push([8,c]);for(let r=7;r>=1;r--)a.push([r,0]);return a}const coords=ringCoords();
function makeBoard(){for(let r=0;r<9;r++)for(let c=0;c<9;c++){let e=document.createElement('div');e.className='cell';e.style.left=c*100/9+'%';e.style.top=r*100/9+'%';e.style.width=100/9+'%';e.style.height=100/9+'%';board.appendChild(e)}}makeBoard();
function posStyle(pos){let [r,c]=coords[(pos+32)%32];return{left:(c+.5)*100/9+'%',top:(r+.5)*100/9+'%'}}function renderPieces(){board.querySelectorAll('.piece,.cushion').forEach(x=>x.remove());players.forEach(p=>{if(p.done)return;let ps=posStyle(p.pos),cu=document.createElement('div');cu.className='cushion';cu.style.left=ps.left;cu.style.top=ps.top;cu.style.background=p.color;board.appendChild(cu);let e=document.createElement('div');e.className='piece';e.style.left=ps.left;e.style.top=ps.top;e.textContent=ranks[p.rank];board.appendChild(e)})}function renderPlayers(){let root=document.getElementById('players');root.innerHTML='';players.forEach((p,i)=>{let e=document.createElement('div');e.className='playerBox'+(running&&i===turnIndex&&!p.done?' active':'')+(p.done?' done':'');e.innerHTML='<b style="color:'+p.color+'">● '+p.name+'</b><br>'+ranks[p.rank]+'　位置 '+p.pos+(p.cpu?'　CPU':'')+(p.done?'<br><b>'+p.place+'位</b>':'');root.appendChild(e)})}function updateButtons(){let p=players[turnIndex];rollBtn.disabled=!running||busy||!p||p.cpu||p.done;autoBtn.disabled=!running||busy||!p||!p.cpu||p.done}function render(){renderPieces();renderPlayers();updateButtons()}
function isCorner(pos){return cornerRing.includes(pos%32)}function promotion(p,d){p.rank=Math.max(0,Math.min(ranks.length-1,p.rank+d))}function oppositePair(a,b){let[ra,ca]=coords[a],[rb,cb]=coords[b];if(isCorner(a)||isCorner(b))return false;return(ra===0&&rb===8&&ca===cb&&ca>0&&ca<8)||(ra===8&&rb===0&&ca===cb&&ca>0&&ca<8)||(ca===0&&cb===8&&ra===rb&&ra>0&&ra<8)||(ca===8&&cb===0&&ra===rb&&ra>0&&ra<8)}function findWar(i){for(let j=0;j<players.length;j++)if(j!==i&&!players[j].done&&oppositePair(players[i].pos,players[j].pos))return j;return-1}
function goldRoll(){let o=[];for(let i=0;i<4;i++){let x=Math.random();if(x<.002)o.push({type:'vertical',value:10,label:'縦'});else if(x<.028)o.push({type:'side',value:5,label:'横'});else if(x<.514)o.push({type:'face',value:1,label:'表'});else o.push({type:'back',value:0,label:'裏'})}return o}const total=g=>g.reduce((s,x)=>s+x.value,0);async function showGold(g,id='goldArea'){let root=document.getElementById(id);root.innerHTML='';g.forEach((x,i)=>{let e=document.createElement('div');e.className='gold';e.textContent='金';e.style.transform='translateY(-45px) rotate('+(Math.random()*160-80)+'deg)';root.appendChild(e);setTimeout(()=>{e.className='gold '+(x.type==='side'?'side':x.type==='vertical'?'vertical':'');e.textContent=x.type==='back'?'':x.type==='face'?'金':x.label;e.style.transform='translateY(0)'},60+i*55)});await sleep(650)}async function movePlayer(p,n){for(let i=0;i<n;i++){p.pos=(p.pos+1)%32;renderPieces();await sleep(160)}}async function flipMoment(){board.querySelectorAll('.piece').forEach(e=>e.style.transform='translate(-50%,-50%) rotateY(180deg)');await sleep(260);renderPieces()}
function nextTurn(){if(players.filter(p=>!p.done).length<=1){let last=players.find(p=>!p.done);if(last){last.done=true;last.place=players.length}running=false;log('全員の順位が決まりました。');render();return}do{turnIndex=(turnIndex+1)%players.length}while(players[turnIndex].done);render();let p=players[turnIndex];resultEl.textContent=p.name+'の番';if(p.cpu)setTimeout(takeTurn,500)}
async function takeTurn(){if(busy||!running)return;busy=true;updateButtons();let p=players[turnIndex],g=goldRoll();await showGold(g);let n=total(g);resultEl.textContent=p.name+'：'+n;log(p.name+'　'+g.map(x=>x.label).join('・')+' = '+n);await movePlayer(p,n);if(isCorner(p.pos)){promotion(p,1);log(p.name+'が角に止まり、'+ranks[p.rank]+'へ出世');await flipMoment();if(p.rank===12){p.done=true;p.place=players.filter(x=>x.done).length;log(p.name+'が王になり、'+p.place+'位で上がり');render();busy=false;nextTurn();return}}let enemy=findWar(turnIndex);render();if(enemy>=0){busy=false;startWar(turnIndex,enemy);return}busy=false;nextTurn()}
function buildWarTrack(){let root=document.getElementById('warTrack');root.innerHTML='';for(let i=0;i<=16;i++){let c=document.createElement('div');c.className='warCell';root.appendChild(c)}}function renderWar(){buildWarTrack();let cells=[...document.querySelectorAll('.warCell')];war.fighters.forEach((idx,k)=>{let m=document.createElement('div');m.className='warMark';m.style.background=players[idx].color;cells[war.progress[k]].appendChild(m)});let current=players[war.fighters[war.turn]];document.getElementById('warStatus').textContent=war.phase==='initiative'?'先攻を決めます':current.name+'の番';document.getElementById('warTitle').innerHTML='<b>'+players[war.fighters[0]].name+'</b> 対 <b>'+players[war.fighters[1]].name+'</b><div class="small">16マス進んで先に自陣へ戻れば勝ち</div>'}function startWar(a,b){war={fighters:[a,b],progress:[0,0],turn:0,phase:'initiative',initiativeRolls:[]};document.getElementById('warModal').classList.add('show');renderWar();if(players[a].cpu&&players[b].cpu)setTimeout(warAction,500)}
async function warAction(){let btn=document.getElementById('warRoll');btn.disabled=true;if(war.phase==='initiative'){war.initiativeRolls=[];for(let k=0;k<2;k++){let g=goldRoll();await showGold(g,'warGold');let n=total(g);war.initiativeRolls.push(n);log('戦争先攻決め：'+players[war.fighters[k]].name+' = '+n);await sleep(250)}if(war.initiativeRolls[0]===war.initiativeRolls[1]){log('同点。仕切り直し');btn.disabled=false;return}war.turn=war.initiativeRolls[0]>war.initiativeRolls[1]?0:1;war.phase='race';renderWar()}else{let k=war.turn,idx=war.fighters[k],g=goldRoll();await showGold(g,'warGold');let n=total(g);war.progress[k]=Math.min(16,war.progress[k]+n);log('戦争：'+players[idx].name+' '+n+'進む（'+war.progress[k]+'/16）');renderWar();if(war.progress[k]>=16){let winner=idx,loser=war.fighters[1-k];promotion(players[winner],1);promotion(players[loser],-1);log(players[winner].name+'勝利：'+ranks[players[winner].rank]+'へ／'+players[loser].name+'は'+ranks[players[loser].rank]+'へ降格');await sleep(650);document.getElementById('warModal').classList.remove('show');war=null;render();nextTurn();return}war.turn=1-k;renderWar()}btn.disabled=false;let current=war&&players[war.fighters[war.turn]];if(war&&current.cpu)setTimeout(warAction,450)}
document.getElementById('warRoll').onclick=warAction;rollBtn.onclick=takeTurn;autoBtn.onclick=takeTurn;function seatClick(seat){let count=+document.getElementById('count').value;if(count<=2)selectedSeats=[seat,(seat+2)%4];else{let i=selectedSeats.indexOf(seat);if(i>=0)selectedSeats.splice(i,1);else if(selectedSeats.length<count)selectedSeats.push(seat)}paintSeats()}function paintSeats(){document.querySelectorAll('.seat').forEach(e=>e.classList.toggle('selected',selectedSeats.includes(+e.dataset.seat)))}document.querySelectorAll('.seat').forEach(e=>e.onclick=()=>seatClick(+e.dataset.seat));document.getElementById('resetSeats').onclick=()=>{selectedSeats=[];paintSeats()};document.getElementById('count').onchange=()=>{selectedSeats=[];paintSeats()};
async function orderRoll(){log('順番決め：全員が金を振ります');let candidates=players.map((_,i)=>i);while(true){let scores=[];for(let i of candidates){let g=goldRoll();await showGold(g);let n=total(g);scores.push([i,n]);log(players[i].name+' = '+n)}let max=Math.max(...scores.map(x=>x[1])),top=scores.filter(x=>x[1]===max).map(x=>x[0]);if(top.length===1){let first=top[0],seat=players[first].seat;players.sort((a,b)=>((a.seat-seat+4)%4)-((b.seat-seat+4)%4));log(players[0].name+'が先攻。ここから右回り');turnIndex=0;return}log('1位同点。該当者だけ振り直し');candidates=top}}
document.getElementById('start').onclick=async()=>{let count=+document.getElementById('count').value,needed=count===1?2:count;if(selectedSeats.length!==needed){alert('必要な数の角を選んでください');return}players=selectedSeats.sort((a,b)=>a-b).map((seat,i)=>({name:count===1?(i===0?'あなた':'CPU'):'プレイヤー'+(i+1),seat,pos:cornerRing[seat],rank:0,color:colors[i],cpu:count===1&&i===1,done:false,place:null}));logEl.innerHTML='';running=false;render();await orderRoll();running=true;resultEl.textContent=players[0].name+'の番';render();if(players[0].cpu)setTimeout(takeTurn,500)};
</script></body></html>
