<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>まわり将棋 v0.4.2</title><style>
:root{--bg:#e8e2d8;--panel:#f7f3eb;--ink:#201f1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:900px;margin:auto;padding:12px}.card{background:var(--panel);border-radius:18px;padding:12px;margin:10px 0;box-shadow:0 8px 22px #0001}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select,input{font-size:15px;border-radius:11px;padding:10px}button{border:0;background:#222;color:#fff;font-weight:800}select,input{border:1px solid #bbb;background:white}.sub,.small{color:#746d63;font-size:12px}.names{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px}.namebox{background:#ebe5db;border-radius:12px;padding:8px}.namebox input{width:100%;margin-top:4px}#turn{font-size:20px;font-weight:900;text-align:center;padding:9px;border-radius:13px;background:#e8e0d4;margin-bottom:8px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:8px}@media(max-width:700px){.layout{display:block}.ladder{margin-top:10px}.ladder #ladder{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px}.rr{min-height:48px;border:1px solid #d5cab9;border-radius:7px;font-size:11px;writing-mode:vertical-rl;text-orientation:upright}.marks{position:absolute;right:50%;bottom:2px;transform:translateX(50%);max-width:100%;justify-content:center}.mk{width:10px;height:10px}#board{width:100%}}#board{position:relative;width:min(78vw,590px);aspect-ratio:1;background:linear-gradient(115deg,#e1bc7c,#c99759);border:4px solid #574329;overflow:hidden}.cell{position:absolute;border:1px solid #69502f88}.piece{position:absolute;z-index:7;width:8.5%;height:10.5%;transform:translate(-50%,-50%) rotate(var(--r));clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);background:linear-gradient(145deg,#f1d19a,#c8944c);border:1px solid #68451d;display:flex;align-items:center;justify-content:center;font-family:"Yu Mincho",serif;font-weight:900;font-size:clamp(10px,2.7vw,20px);line-height:.9;text-align:center;filter:drop-shadow(0 3px 2px #0003);transition:left .18s,top .18s,transform .2s}.piece.active{filter:drop-shadow(0 0 10px var(--g)) drop-shadow(0 3px 2px #0003);transform:translate(-50%,-58%) rotate(var(--r)) scale(1.08)}.helper{font-size:.5em;display:block}.cushion{position:absolute;z-index:5;width:9.5%;height:4%;transform:translate(-50%,45%);border-radius:50%;opacity:.75}.hand{position:absolute;z-index:12;width:16%;height:10%;border-radius:55%;background:#e2b28d;box-shadow:0 5px 12px #0003;opacity:0;transition:left .16s,top .16s,opacity .12s;transform:translate(-50%,-50%)}.hand:after{content:"";position:absolute;left:-32%;top:18%;width:55%;height:62%;background:var(--s);border-radius:40%}.hand.show{opacity:.96}.event{position:absolute;z-index:25;left:50%;top:50%;transform:translate(-50%,-50%);width:78%;background:#f8f4ebf2;border-radius:18px;padding:14px;text-align:center;box-shadow:0 15px 40px #0005;display:none}.event.show{display:block}.shade{position:absolute;inset:0;background:#0002;z-index:9;display:none}.shade.show{display:block}.line{position:absolute;z-index:10;background:#fff8;border-radius:9px}.roller{position:relative;height:140px;background:#e5ded2;border-radius:18px;margin-top:8px;touch-action:none;overflow:hidden}.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;color:#665e54;pointer-events:none}.gold{position:absolute;width:47px;height:55px;clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);background:linear-gradient(145deg,#f1d19a,#c8944c);border:2px solid #68451d;display:flex;align-items:center;justify-content:center;font-family:serif;font-weight:900;transform:translate(-50%,-50%) rotate(var(--gr));transition:left .1s,top .1s,transform .25s}.gold.side{width:58px;height:13px;clip-path:none;border-radius:5px}.gold.vertical{width:12px;height:56px;clip-path:none;border-radius:5px}.ladder{background:#ebe5db;border-radius:14px;padding:6px}.ladder h3{text-align:center;font-size:13px;margin:2px}.rr{min-height:28px;border-top:1px solid #d5cab9;display:flex;align-items:center;justify-content:center;font-family:"Yu Mincho",serif;font-weight:800;font-size:12px;position:relative}.marks{position:absolute;right:2px;display:flex;gap:2px;flex-wrap:wrap;max-width:44px}.mk{width:11px;height:11px;border-radius:50%;box-shadow:0 1px 2px #0004}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.pb{padding:8px;border-radius:12px;background:#ebe5db;font-size:13px}.pb.on{outline:3px solid #222}.you{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:999px;background:#222;color:#fff;font-size:11px}.humanSeat{box-shadow:inset 0 0 0 2px #fff8}.log{height:135px;overflow:auto;background:#171714;color:white;border-radius:12px;padding:8px;font:11px/1.5 ui-monospace,monospace}
</style></head><body><div class="app"><h1>まわり将棋</h1><div class="sub">v0.4.1 — CPU・自分表示・戦争方向 修正版</div>
<div class="card"><div class="row"><label>人間の人数</label><select id="hc"><option>1</option><option>2</option><option>3</option><option>4</option></select><button id="namesBtn">名前を更新</button></div><div class="small">足りない席は名前付きの自動プレイヤーが担当します。</div><div id="names" class="names"></div><button id="start" style="margin-top:9px">順番を決めて開始</button></div>
<div class="card"><div id="turn">開始前</div><div class="layout"><div><div id="board"><div id="shade" class="shade"></div><div id="hand" class="hand"></div><div id="event" class="event"></div></div><div id="roller" class="roller"><div class="hint">金を指でくるくる回し、<br>好きなところで指を離す</div></div><div id="result" style="text-align:center;font-weight:900;margin-top:6px"></div></div><div class="ladder"><h3>出世表</h3><div id="ladder"></div></div></div></div>
<div class="card"><div id="players" class="players"></div></div><div class="card"><div id="log" class="log"></div></div></div>
<script>
const C=['#b8493f','#315f8c','#668447','#8a5b91'],S=['#8f3b32','#244f78','#56743e','#704875'],N=['たかし','みき','けんじ','ゆうこ'],R=['歩','と','香','成香','桂','成桂','銀','成銀','角','馬','飛','龍','王'],K=[0,8,16,24];
const B=document.querySelector('#board'),roller=document.querySelector('#roller'),turn=document.querySelector('#turn'),hand=document.querySelector('#hand'),eventBox=document.querySelector('#event'),shade=document.querySelector('#shade'),logEl=document.querySelector('#log');let P=[],ti=0,run=false,busy=false,war=null,audio=null,g={on:false,last:0,total:0,cx:0,cy:0};
const sleep=m=>new Promise(r=>setTimeout(r,m));function log(s){let d=document.createElement('div');d.textContent=s;logEl.appendChild(d);logEl.scrollTop=9999}function ctx(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)()}function tone(f,d=.04,v=.025,t='triangle'){ctx();let o=audio.createOscillator(),q=audio.createGain();o.type=t;o.frequency.value=f;q.gain.value=v;o.connect(q);q.connect(audio.destination);o.start();q.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}function clack(){tone(500+Math.random()*180,.035,.018,'square')}function thud(){tone(120,.09,.05)}
function coords(){let a=[];for(let c=0;c<9;c++)a.push([0,c]);for(let r=1;r<9;r++)a.push([r,8]);for(let c=7;c>=0;c--)a.push([8,c]);for(let r=7;r>=1;r--)a.push([r,0]);return a}const Q=coords();
function mkBoard(){B.querySelectorAll('.cell').forEach(x=>x.remove());for(let r=0;r<9;r++)for(let c=0;c<9;c++){let e=document.createElement('div');e.className='cell';e.style.left=c*100/9+'%';e.style.top=r*100/9+'%';e.style.width=e.style.height=100/9+'%';B.insertBefore(e,shade)}}mkBoard();
function ps(pos){let[r,c]=Q[(pos+32)%32];return{l:(c+.5)*100/9+'%',t:(r+.5)*100/9+'%'}}function dir(p){p=(p+32)%32;return p<=8?90:p<=16?180:p<=24?270:0}function corner(p){return K.includes((p+32)%32)}
function disp(p){let same=P.filter(x=>!x.done&&x.rank===p.rank),n=same.indexOf(p);if((p.rank===8||p.rank===9)&&n>=2)return p.rank===8?['成銀','歩']:['成銀','と'];if((p.rank===10||p.rank===11)&&n>=2)return p.rank===10?['馬','歩']:['馬','と'];return[R[p.rank],null]}function html(p){let d=disp(p);return d[1]?d[0]+'<span class="helper">＋'+d[1]+'</span>':d[0]}
function renderPieces(){B.querySelectorAll('.piece,.cushion,.line').forEach(x=>x.remove());if(war)return renderWar();P.forEach((p,i)=>{if(p.done)return;let z=ps(p.pos),c=document.createElement('div');c.className='cushion';c.style.left=z.l;c.style.top=z.t;c.style.background=p.color;B.insertBefore(c,shade);let e=document.createElement('div');e.className='piece'+(run&&i===ti?' active':'');e.style.left=z.l;e.style.top=z.t;e.style.setProperty('--r',dir(p.pos)+'deg');e.style.setProperty('--g',p.color);e.innerHTML=html(p);B.insertBefore(e,shade)})}
function renderUI(){let p=P[ti];if(run&&p){let x=war?wp():p;turn.textContent=war?(war.phase==='init'?x.name+'：先攻決め':x.name+'：戦争'):(p.name+(p.cpu?'':'（あなた）')+'の番');turn.style.color=x.color;turn.style.boxShadow='inset 0 0 0 3px '+x.color}else{turn.textContent='開始前';turn.style.boxShadow='none'}let a=document.querySelector('#players');a.innerHTML='';P.forEach((p,i)=>{let e=document.createElement('div');e.className='pb'+(run&&i===ti?' on':'')+(!p.cpu?' humanSeat':'');e.innerHTML='<b style="color:'+p.color+'">● '+p.name+'</b>'+(!p.cpu?'<span class="you">あなた</span>':'')+'<br>'+R[p.rank]+(p.cpu?'・自動':'')+(p.done?'<br>'+p.place+'位':'');a.appendChild(e)});let l=document.querySelector('#ladder');l.innerHTML='';for(let r=12;r>=0;r--){let e=document.createElement('div');e.className='rr';e.textContent=R[r];let m=document.createElement('div');m.className='marks';P.forEach(p=>{if(p.rank===r){let q=document.createElement('i');q.className='mk';q.style.background=p.color;m.appendChild(q)}});e.appendChild(m);l.appendChild(e)}}function render(){renderPieces();renderUI()}
async function ev(t,h='',ms=650){eventBox.innerHTML='<h2>'+t+'</h2>'+h;eventBox.classList.add('show');await sleep(ms);eventBox.classList.remove('show')}async function showHand(pos,i){let z=ps(pos);hand.style.left=z.l;hand.style.top=z.t;hand.style.setProperty('--s',P[i].sleeve);hand.classList.add('show');await sleep(145)}async function showHandRC(r,c,i){let z=rc(r,c);hand.style.left=z.l;hand.style.top=z.t;hand.style.setProperty('--s',P[i].sleeve);hand.classList.add('show');await sleep(145)}async function move(i,n){await showHand(P[i].pos,i);for(let k=0;k<n;k++){P[i].pos=(P[i].pos+1)%32;await showHand(P[i].pos,i);clack();renderPieces();await sleep(185)}hand.classList.remove('show')}
async function rank(i,d,label){let p=P[i],b=R[p.rank];p.rank=Math.max(0,Math.min(12,p.rank+d));await ev(label,'<div style="font-size:20px;font-weight:900;color:'+p.color+'">'+p.name+'<br>'+b+' → '+R[p.rank]+'</div>',760);thud();render();log(p.name+'：'+b+' → '+R[p.rank])}
function opp(a,b){let[ra,ca]=Q[a],[rb,cb]=Q[b];if(corner(a)||corner(b))return false;return(ra===0&&rb===8&&ca===cb&&ca>0&&ca<8)||(ra===8&&rb===0&&ca===cb&&ca>0&&ca<8)||(ca===0&&cb===8&&ra===rb&&ra>0&&ra<8)||(ca===8&&cb===0&&ra===rb&&ra>0&&ra<8)}function enemy(i){for(let j=0;j<4;j++)if(j!==i&&!P[j].done&&opp(P[i].pos,P[j].pos))return j;return-1}
function roll(){let o=[];for(let i=0;i<4;i++){let x=Math.random();o.push(x<.002?['vertical',10,'縦']:x<.028?['side',5,'横']:x<.514?['face',1,'表']:['back',0,'裏'])}return o}function sum(o){return o.reduce((s,x)=>s+x[1],0)}function makeGold(){roller.querySelectorAll('.gold').forEach(x=>x.remove());let x=roller.clientWidth/2,y=roller.clientHeight/2;for(let i=0;i<4;i++){let e=document.createElement('div');e.className='gold';e.textContent='金';let a=i*Math.PI/2;e.style.left=x+Math.cos(a)*42+'px';e.style.top=y+Math.sin(a)*33+'px';roller.appendChild(e)}}function spin(a){let x=roller.clientWidth/2,y=roller.clientHeight/2;[...roller.querySelectorAll('.gold')].forEach((e,i)=>{let q=a+i*Math.PI/2;e.style.left=x+Math.cos(q)*45+'px';e.style.top=y+Math.sin(q)*35+'px';e.style.setProperty('--gr',q*57.3+'deg')})}async function settle(o){[...roller.querySelectorAll('.gold')].forEach((e,i)=>{let x=o[i];e.className='gold '+(x[0]==='side'?'side':x[0]==='vertical'?'vertical':'');e.textContent=x[0]==='back'?'':x[0]==='face'?'金':x[2];e.style.left=23+i*18+'%';e.style.top='54%'});await sleep(600);thud()}
function path(a,b){let[ra,ca]=Q[P[a].pos],[rb,cb]=Q[P[b].pos],o=[];for(let i=0;i<=8;i++){let t=i/8;o.push([ra+(rb-ra)*t,ca+(cb-ca)*t])}for(let i=1;i<=8;i++){let t=i/8;o.push([rb+(ra-rb)*t,cb+(ca-cb)*t])}return o}function rc(r,c){return{l:(c+.5)*100/9+'%',t:(r+.5)*100/9+'%'}}function renderWar(){shade.classList.add('show');war.f.forEach((idx,k)=>{let route=war.paths[k],a=route[0],b=route[8],la=rc(...a),lb=rc(...b);if(k===0){let line=document.createElement('div');line.className='line';if(Math.abs(a[0]-b[0])<.01){line.style.left=Math.min(parseFloat(la.l),parseFloat(lb.l))+'%';line.style.top='calc('+la.t+' - 3px)';line.style.width=Math.abs(parseFloat(lb.l)-parseFloat(la.l))+'%';line.style.height='6px'}else{line.style.left='calc('+la.l+' - 3px)';line.style.top=Math.min(parseFloat(la.t),parseFloat(lb.t))+'%';line.style.height=Math.abs(parseFloat(lb.t)-parseFloat(la.t))+'%';line.style.width='6px'}B.insertBefore(line,shade)}let [r,c]=route[war.p[k]],z=rc(r,c),e=document.createElement('div');e.className='piece';e.style.left=z.l;e.style.top=z.t;let [nr,nc]=route[Math.min(16,war.p[k]+1)],dr=nr-r,dc=nc-c,rot=Math.abs(dc)>Math.abs(dr)?(dc>0?90:270):(dr>0?180:0);e.style.setProperty('--r',rot+'deg');e.innerHTML=html(P[idx]);e.style.filter='drop-shadow(0 0 9px '+P[idx].color+')';B.insertBefore(e,shade)})}function wp(){return P[war.f[war.phase==='init'?war.it:war.turn]]}
async function startWar(a,b){war={f:[a,b],p:[0,0],phase:'init',init:[null,null],it:0,turn:0,paths:[path(a,b),path(b,a)]};render();await ev('戦争','<b style="color:'+P[a].color+'">'+P[a].name+'</b> 対 <b style="color:'+P[b].color+'">'+P[b].name+'</b>',750);busy=false;renderUI();if(wp().cpu)setTimeout(auto,650)}
async function moveWar(k,n){let idx=war.f[k],route=war.paths[k];let goal=Math.min(16,war.p[k]+n);let [sr,sc]=route[war.p[k]];await showHandRC(sr,sc,idx);while(war.p[k]<goal){war.p[k]++;let [r,c]=route[war.p[k]];await showHandRC(r,c,idx);clack();renderPieces();await sleep(185)}hand.classList.remove('show');await sleep(90)}
async function resolveWar(n){if(war.phase==='init'){war.init[war.it]=n;if(war.it===0){war.it=1;busy=false;renderUI();if(wp().cpu)setTimeout(auto,600);return}if(war.init[0]===war.init[1]){await ev('同点','仕切り直し',550);war.init=[null,null];war.it=0;busy=false;renderUI();if(wp().cpu)setTimeout(auto,600);return}war.turn=war.init[0]>war.init[1]?0:1;war.phase='race';await ev('先攻','<b style="color:'+wp().color+'">'+wp().name+'</b>',600);busy=false;render();if(wp().cpu)setTimeout(auto,600);return}let k=war.turn,idx=war.f[k];await moveWar(k,n);render();if(war.p[k]>=16){let w=idx,l=war.f[1-k];await ev('勝負あり','<b style="color:'+P[w].color+'">'+P[w].name+' 勝利</b>',650);await rank(w,1,'戦争勝利・出世');await rank(l,-1,'戦争敗北・降格');war=null;shade.classList.remove('show');busy=false;render();next();return}war.turn=1-k;busy=false;render();if(wp().cpu)setTimeout(auto,600)}
async function doRoll(forceAuto=false){if(busy||!run)return;let p=war?wp():P[ti];if(p.cpu&&!forceAuto)return;busy=true;renderUI();let o=roll(),n=sum(o);await settle(o);document.querySelector('#result').textContent=p.name+'：'+n;log(p.name+' '+o.map(x=>x[2]).join('・')+'='+n);if(war)return resolveWar(n);await move(ti,n);if(corner(P[ti].pos)){await rank(ti,1,'角で出世');if(P[ti].rank===12){P[ti].done=true;P[ti].place=P.filter(x=>x.done).length;await ev('王になりました',P[ti].name+' '+P[ti].place+'位',700);busy=false;return next()}}let e=enemy(ti);if(e>=0){busy=false;return startWar(ti,e)}busy=false;next()}
function next(){if(P.filter(x=>!x.done).length<=1){let x=P.find(x=>!x.done);if(x){x.done=true;x.place=4}run=false;render();return}do{ti=(ti+1)%4}while(P[ti].done);render();if(P[ti].cpu)setTimeout(auto,650)}async function auto(){if(busy||!run)return;renderUI();for(let i=0;i<5;i++){spin(Math.random()*6);clack();await sleep(90)}await doRoll(true)}
roller.addEventListener('pointerdown',e=>{if(!run||busy||(war?wp():P[ti]).cpu)return;ctx();let r=roller.getBoundingClientRect();g.on=true;g.cx=r.left+r.width/2;g.cy=r.top+r.height/2;g.last=Math.atan2(e.clientY-g.cy,e.clientX-g.cx);roller.setPointerCapture(e.pointerId)});roller.addEventListener('pointermove',e=>{if(!g.on)return;let a=Math.atan2(e.clientY-g.cy,e.clientX-g.cx),d=a-g.last;g.last=a;spin(a);if(Math.abs(d)>.04)clack()});roller.addEventListener('pointerup',()=>{if(!g.on)return;g.on=false;doRoll()});
function names(){let n=+document.querySelector('#hc').value,r=document.querySelector('#names');r.innerHTML='';for(let i=0;i<4;i++){let e=document.createElement('div');e.className='namebox';e.innerHTML='<b style="color:'+C[i]+'">席'+(i+1)+' '+(i<n?'人間':'自動')+'</b><input id="nm'+i+'" value="'+N[i]+'">';r.appendChild(e)}}document.querySelector('#namesBtn').onclick=names;document.querySelector('#hc').onchange=names;names();
async function order(){let cand=[0,1,2,3];while(1){let s=cand.map(i=>[i,sum(roll())]),m=Math.max(...s.map(x=>x[1])),t=s.filter(x=>x[1]===m).map(x=>x[0]);s.forEach(x=>log(P[x[0]].name+'='+x[1]));if(t.length===1){let fs=P[t[0]].seat;P.sort((a,b)=>((a.seat-fs+4)%4)-((b.seat-fs+4)%4));ti=0;await ev('先攻','<b style="color:'+P[0].color+'">'+P[0].name+'</b><div class="small">ここから右回り</div>',700);return}cand=t;log('1位同点。振り直し')}}
document.querySelector('#start').onclick=async()=>{ctx();let h=+document.querySelector('#hc').value;P=[0,1,2,3].map(i=>({name:document.querySelector('#nm'+i).value||N[i],seat:i,pos:K[i],rank:0,color:C[i],sleeve:S[i],cpu:i>=h,done:false,place:null}));logEl.innerHTML='';war=null;run=false;busy=true;makeGold();render();await order();run=true;busy=false;render();if(P[0].cpu)setTimeout(auto,600)};window.addEventListener('resize',makeGold);makeGold();renderUI();
</script></body></html>
